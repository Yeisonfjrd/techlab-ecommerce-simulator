name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B verify

  # Same tests against a real PostgreSQL, so the migrations are proven on the database we deploy to
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: techlab
          POSTGRES_USER: techlab
          POSTGRES_PASSWORD: techlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techlab"
          --health-interval 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://localhost:5432/techlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: mvn -B verify

  # Si fallan los tests, ai-fix le pide un arreglo a un modelo local y abre un PR solo si todos pasan.
  # https://github.com/Yeisonfjrd/ai-fix-maven-plugin
  ai-fix:
    needs: h2
    if: >-
      failure()
      && !startsWith(github.head_ref || github.ref_name, 'ai-fix/')
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: Yeisonfjrd/ai-fix-maven-plugin@main
