spring:
  application:
    name: techlab-ecommerce
  datasource:
    # PostgreSQL mode so the same Flyway migrations run on H2 and on the real database
    url: jdbc:h2:mem:techlab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

techlab:
  stock:
    # products with this many units or fewer show up in /api/products/low-stock
    low-threshold: 5
